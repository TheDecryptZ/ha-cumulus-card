name: Validation HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: Validation HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Action HACS
        uses: hacs/action@main
        with:
          category: plugin

  syntax:
    name: Contrôle de syntaxe JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check ha-cumulus-card.js
